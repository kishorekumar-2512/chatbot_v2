name: Production Blue-Green CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      manual_cutover_target:
        description: 'Manually force deploy to specific color (auto / blue / green)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - blue
          - green

permissions:
  contents: read
  packages: write

concurrency:
  group: blue-green-deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push Container Images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      backend_image: ${{ steps.meta-backend.outputs.tags }}
      web_image: ${{ steps.meta-web.outputs.tags }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/chatbot-backend
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for Web SPA
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/chatbot-web
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build and push Web SPA image
        uses: docker/build-push-action@v5
        with:
          context: ./web
          file: web/Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-blue-green:
    name: Deploy to Idle Stack & Zero-Downtime Cutover
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute Blue-Green Deployment over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: sha-${{ github.sha }}
          MANUAL_TARGET: ${{ inputs.manual_cutover_target || 'auto' }}
          REPO_NAME: ${{ github.repository }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_TAG,MANUAL_TARGET,REPO_NAME
          script: |
            set -euo pipefail
            cd /opt/chatbot_v2

            # 1. Determine active and idle colors
            if [[ -f .active_color ]]; then
              ACTIVE_COLOR=$(cat .active_color)
            else
              ACTIVE_COLOR="blue"
              echo "blue" > .active_color
            fi

            if [[ "$MANUAL_TARGET" != "auto" ]]; then
              IDLE_COLOR="$MANUAL_TARGET"
            else
              if [[ "$ACTIVE_COLOR" == "blue" ]]; then
                IDLE_COLOR="green"
              else
                IDLE_COLOR="blue"
              fi
            fi

            echo "=========================================================="
            echo " Current Active: $ACTIVE_COLOR"
            echo " Target Idle:    $IDLE_COLOR (Deploying new release)"
            echo " Image Tag:      $IMAGE_TAG"
            echo "=========================================================="

            # 2. Pull new container images
            export BACKEND_IMAGE="ghcr.io/${REPO_NAME}/chatbot-backend:${IMAGE_TAG}"
            export WEB_IMAGE="ghcr.io/${REPO_NAME}/chatbot-web:${IMAGE_TAG}"

            echo "Pulling images..."
            docker compose -f "docker-compose.${IDLE_COLOR}.yml" pull

            # 3. Start idle stack
            echo "Bringing up ${IDLE_COLOR^^} stack..."
            docker compose -f "docker-compose.${IDLE_COLOR}.yml" up -d --remove-orphans

            # 4. Run automated health check against idle stack
            echo "Running smoke tests on ${IDLE_COLOR^^} stack..."
            if ! ./scripts/health_check.sh "$IDLE_COLOR" 12 5; then
              echo "❌ Deployment failed smoke tests on ${IDLE_COLOR^^}! Keeping ${ACTIVE_COLOR^^} live."
              docker compose -f "docker-compose.${IDLE_COLOR}.yml" stop
              exit 1
            fi

            # 5. Atomic zero-downtime cutover
            echo "Health checks passed! Switching traffic to ${IDLE_COLOR^^}..."
            ./scripts/switch_traffic.sh "$IDLE_COLOR"

            echo "=========================================================="
            echo "✅ Release successfully deployed & live on ${IDLE_COLOR^^}!"
            echo "   Old stack (${ACTIVE_COLOR^^}) kept running for instant rollback."
            echo "=========================================================="
