# Production Host Nginx Reverse Proxy
# Dynamically routes public traffic to whichever color is live (Blue or Green)

include /etc/nginx/conf.d/upstream_active.conf;

server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    # Public entrance — routes to the active color's frontend container
    location / {
        proxy_pass http://chatbot_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for live Server-Sent Events (SSE /chat/stream)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding off;
    }

    # Direct health check on proxy itself
    location /nginx-health {
        access_log off;
        return 200 "healthy
";
    }
}
